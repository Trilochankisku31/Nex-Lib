<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join NexLib | Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --accent: #0ea5e9;
            --dark: #0f172a;
            --gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }

        body {
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .signup-card {
            background: white;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 28px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            display: inline-block;
        }

        h2 { font-size: 1.75rem; color: var(--dark); margin-bottom: 8px; }
        p.subtitle { color: var(--gray); margin-bottom: 30px; font-size: 0.95rem; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            text-align: left;
        }

        .input-group { margin-bottom: 20px; text-align: left; }
        .full-width { grid-column: span 2; }

        .input-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: #475569;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            outline: none;
            transition: 0.3s;
            font-size: 0.95rem;
        }

        .input-group input:focus { border-color: var(--primary); background: #fcfdff; }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-signup:hover { background: #4f46e5; transform: translateY(-2px); }

        .footer-text { margin-top: 25px; font-size: 0.9rem; color: var(--gray); }
        .footer-text a { color: var(--primary); text-decoration: none; font-weight: 700; }

        /* Responsive Mobile Layout */
        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .full-width { grid-column: span 1; }
            .signup-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <div class="logo"><i class="fas fa-bolt-lightning"></i> NexLib</div>
        <h2>Create Account</h2>
        <p class="subtitle">Join our community of technical learners.</p>

        <form>
            <div class="form-grid">
                <div class="input-group">
                    <label>First Name</label>
                    <input type="text" placeholder="John" required>
                </div>
                
                <div class="input-group">
                    <label>Last Name</label>
                    <input type="text" placeholder="Doe" required>
                </div>

                <div class="input-group full-width">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>



                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-signup">Create My Account</button>
        </form>

        <p class="footer-text">
            Already have an account? <a href="login.html">Login here</a>
        </p>
        <a href="index.html" style="display: block; margin-top: 15px; color: var(--gray); font-size: 0.8rem; text-decoration: none;">← Back to home</a>
    </div>

</body>
</html>
